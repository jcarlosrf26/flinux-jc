DEFAULT vesamenu.c32
PROMPT 0
TIMEOUT 100
ONTIMEOUT flinuxjc

MENU TITLE flinux-jc
MENU BACKGROUND fjcbg.png
MENU MARGIN 6
MENU VSHIFT 1
MENU ROWS 13
MENU TABMSGROW 19
MENU TABMSG Press ENTER to boot, TAB to edit.
MENU AUTOBOOT flinux-jc will boot in # second{,s}...
MENU HELPMSGROW 21
MENU COLOR border       * #00000000 #00000000 none
MENU COLOR title        * #ffffa040 #00000000 none
MENU COLOR sel          * #ffffffff #cc8c3a10 none
MENU COLOR unsel        * #ffffe0c0 #00000000 none
MENU COLOR help         * #ffffd9b0 #00000000 none
MENU COLOR timeout_msg  * #ffffe0c0 #00000000 none
MENU COLOR timeout      * #ffffa040 #00000000 none
MENU COLOR tabmsg       * #ffffe0c0 #00000000 none

LABEL flinuxjc
MENU DEFAULT
MENU LABEL Boot flinux-jc (FLWM clasico, Xorg)
TEXT HELP
flinux-jc: Tiny Core 17.1 x86 remaster with Xorg, ALSA,
FLRadio, FLTV, FLTube, FLConnect.
ENDTEXT
KERNEL /boot/vmlinuz
INITRD /boot/core.gz
APPEND loglevel=3 cde showapps desktop=flwm waitusb=5 nortc tz=America/Havana

LABEL core
MENU LABEL Boot Core (command line only)
KERNEL /boot/vmlinuz
INITRD /boot/core.gz
APPEND loglevel=3 base waitusb=5
